<style>
  :root{
    --bordo:#821A25;
    --bordo-escuro:#5E121A;
    --verde:#0F3A21;
    --off-white:#F8F6F3;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:var(--off-white);
    color:var(--verde);
    font-family:'Nunito Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px;
    position:relative;
    overflow-x:hidden;
  }

  /* elemento de assinatura: linha de conexão, sutil, remete a "encontrar o caminho de volta" */
  .thread{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    opacity:0.35;
    pointer-events:none;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:560px;
    width:100%;
    text-align:center;
  }

  .brand{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--bordo);
    font-family:'Montserrat', sans-serif;
    font-weight:800;
    letter-spacing:0.08em;
    font-size:0.85rem;
    text-transform:uppercase;
    padding:8px 4px;
    border-radius:4px;
  }
  .brand:focus-visible{ outline:2px solid var(--bordo); outline-offset:4px; }
  .brand span{ color:var(--verde); font-weight:600; letter-spacing:0.04em; }

  .code{
    font-family:'Montserrat', sans-serif;
    font-weight:800;
    font-size:clamp(4.5rem, 16vw, 7.5rem);
    line-height:1;
    color:var(--bordo);
    margin:20px 0 4px;
    letter-spacing:-0.02em;
  }

  h1{
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:clamp(1.3rem, 4vw, 1.7rem);
    margin:0 0 14px;
    color:var(--verde);
  }

  p{
    font-size:1.05rem;
    line-height:1.6;
    color:#3C4A42;
    max-width:440px;
    margin:0 auto 32px;
  }

  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    margin-bottom:36px;
  }

  .btn-primary{
    background:var(--bordo);
    color:var(--off-white);
    text-decoration:none;
    font-family:'Montserrat', sans-serif;
    font-weight:700;
    font-size:0.95rem;
    padding:14px 28px;
    border-radius:6px;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .btn-primary:hover{ background:var(--bordo-escuro); }
  .btn-primary:focus-visible{ outline:2px solid var(--verde); outline-offset:3px; }

  .links{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:4px 22px;
    font-size:0.92rem;
    padding-top:20px;
    border-top:1px solid rgba(15,58,33,0.15);
  }
  .links a{
    color:var(--verde);
    text-decoration:none;
    font-weight:600;
    padding:4px 2px;
    border-bottom:1px solid transparent;
  }
  .links a:hover, .links a:focus-visible{ border-bottom-color:var(--bordo); outline:none; }

  @media (prefers-reduced-motion: no-preference){
    .wrap{ animation:fade-up 0.6s ease both; }
  }
  @keyframes fade-up{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
</style>

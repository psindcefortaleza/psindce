<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post PSINDCE - Instagram</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f4efe6 0%, #e9e2d4 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 18px;
    overflow: hidden;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 12px 36px rgba(0,0,0,0.12);
    border: 1px solid #e5ddcc;
  }
  .card img {
    display: block;
    width: 100%;
    height: auto;
  }
  .card-footer {
    padding: 18px 20px 22px;
    text-align: center;
  }
  .card-footer a {
    display: inline-block;
    text-decoration: none;
    background: #7a1f2b;
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 999px;
    transition: background 0.2s ease;
  }
  .card-footer a:hover {
    background: #5e1620;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="post1.webp" alt="Post PSINDCE">
    <div class="card-footer">
      <a href="https://www.instagram.com/p/DbA4PETO3mU/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA==" target="_blank" rel="noopener noreferrer">Ver post no Instagram</a>
    </div>
  </div>
</body>
